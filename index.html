<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dbeef8"><title>OUR LITTLE HEAVEN · FANCAM ARCHIVE</title><link rel="stylesheet" href="style-v2.css"><script src="config.js" defer></script><script src="app-v2.js" defer></script></head><body>
<header><small>† OUR LITTLE HEAVEN †</small><h1>♡ FANCAM ARCHIVE ♡</h1><nav><a id="photo" target="_blank" rel="noopener noreferrer">PHOTO ARCHIVE ↗</a><button id="admin">관리자 로그인</button><button id="logout" hidden>로그아웃</button></nav></header>
<main class="shell"><section class="card calendar-card"><div class="section-head"><span class="label">01 · STAGE CALENDAR</span><div class="admin-actions"><button id="newPerformance" hidden>＋ 새 공연</button><button id="add" hidden>＋ 영상 등록</button><button id="bulk" class="primary" hidden>＋ 링크 일괄 등록</button></div></div>
<div class="calendar-layout"><div><div class="calendar-nav"><button id="prevMonth" aria-label="이전 달">‹</button><strong id="calendarMonth"></strong><button id="nextMonth" aria-label="다음 달">›</button><button id="todayMonth">이번 달</button></div><div class="weekdays"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div><div id="calendar" class="calendar-grid" aria-label="공연 캘린더"></div></div>
<aside class="performance-browser"><label>공연 검색<input id="performanceSearch" type="search" aria-label="공연명 검색"></label><div class="browser-tools"><button id="undated">날짜 미정</button><button id="clearDate">날짜 선택 해제</button></div><div id="dateLabel" class="label"></div><div id="performanceResults" class="performance-results"></div><div id="performancePaging" class="paging" hidden><button id="prevResults">이전</button><span id="resultPage"></span><button id="nextResults">다음</button></div></aside></div></section>
<section class="card filter-card"><div class="section-head"><span class="label">02 · FANCAM COLLECTION</span><strong id="selectedPerformance"></strong></div><div class="filters"><label>영상 검색<input id="search" type="search"></label><label>곡<select id="song"><option value="">전체 곡</option></select></label><label>플랫폼<select id="platform"><option value="">전체 플랫폼</option><option>YouTube</option><option>X</option><option>Instagram</option></select></label><label>정렬<select id="sort"><option value="new">공연일 최신순</option><option value="old">공연일 오래된순</option><option value="title">제목순</option><option value="updated">최근 수정순</option></select></label></div><div class="toolbar"><span id="count">—</span><button id="reset">필터 초기화</button><button id="refresh">새로고침</button></div></section>
<div id="status" role="status" aria-live="polite"></div><section id="gallery" class="gallery" aria-label="영상 갤러리"></section><button id="moreCards" class="more" hidden>영상 더 보기</button><footer>† OUR LITTLE HEAVEN †<br>TAEMIN FANCAM ARCHIVE</footer></main>
<dialog id="login"><form id="loginForm"><div class="label">PRIVATE · ADMIN ACCESS</div><h2>관리자 로그인</h2><label>비밀번호<input id="password" type="password" autocomplete="current-password" maxlength="512" required></label><p id="loginError" role="alert"></p><div class="actions"><button type="button" data-close>취소</button><button class="primary">로그인</button></div></form></dialog>
<dialog id="editor"><form id="editForm"><div class="label">SAVE A MOMENT</div><h2 id="editHeading">영상 등록</h2><label>제목<input name="title" maxlength="200" required></label><label>영상 링크<input name="url" type="url" maxlength="2000" required></label><div class="two"><label>곡<input name="song" maxlength="100" required></label><label>공연일<input name="date" type="date" readonly></label></div><label>공연<select name="pageId" required></select></label><label>썸네일 URL<input name="thumbnail" type="url" maxlength="2000"></label><label>메모<textarea name="notes" maxlength="1800" rows="3"></textarea></label><label class="check"><input name="embed" type="checkbox" checked>임베드 표시</label><p id="editError" role="alert"></p><div class="actions"><button type="button" data-close>취소</button><button class="primary" id="save">저장</button></div></form></dialog>
<dialog id="bulkDialog"><form id="bulkForm"><div class="label">SAVE MANY MOMENTS</div><h2>링크 일괄 등록</h2><label>공연<select name="pageId" required></select></label><label>곡<input name="song" maxlength="100" required></label><label>영상 링크<textarea name="urls" rows="8" required placeholder="https://x.com/…&#10;https://youtube.com/shorts/…"></textarea></label><p id="bulkStatus" role="status" aria-live="polite"></p><div class="actions"><button type="button" data-close>닫기</button><button id="bulkSave" class="primary">링크 저장</button></div></form></dialog>
<dialog id="performanceDialog"><form id="performanceForm"><div class="label">NEW STAGE</div><h2>새 공연 만들기</h2><label>공연명<input name="title" maxlength="200" required></label><label>공연일<input name="date" type="date"></label><p id="performanceError" role="alert"></p><div class="actions"><button type="button" data-close>취소</button><button id="performanceSave" class="primary">공연 만들기</button></div></form></dialog>
<dialog id="viewer"><div class="viewer-shell"><div class="viewer-head"><span class="label">A LITTLE MOMENT</span><button data-close aria-label="닫기">✕</button></div><h2 id="viewTitle"></h2><div id="viewMeta" class="meta"></div><div id="player"></div><div class="viewer-actions"><details id="notesDetails" hidden><summary>메모</summary><div id="viewNotes"></div></details><a id="original" class="button primary" target="_blank" rel="noopener noreferrer">원본 열기 ↗</a></div></div></dialog>
</body></html>
